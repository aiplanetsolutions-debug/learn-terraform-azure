name: "Terraform Manual Release Pipeline"

on:
  push:
    branches:
      - main

jobs:
  build_and_plan:
    name: "1. Automated Plan Check"
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ fromJSON(secrets.AZURE_CREDENTIALS).clientId }}
      ARM_CLIENT_SECRET: ${{ fromJSON(secrets.AZURE_CREDENTIALS).clientSecret }}
      ARM_SUBSCRIPTION_ID: ${{ fromJSON(secrets.AZURE_CREDENTIALS).subscriptionId }}
      ARM_TENANT_ID: ${{ fromJSON(secrets.AZURE_CREDENTIALS).tenantId }}
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.1.0"

      - name: "Terraform Init"
        run: terraform init

      # Dynamically plans a creation OR a destruction by reading your Git commit text
      - name: "Terraform Plan"
        run: |
          if [[ "${{ github.event.head_commit.message }}" == *"-destroy"* ]]; then
            echo "Detected -destroy flag in commit message. Generating destruction plan."
            terraform plan -destroy -no-color > plan_output.txt
          else
            terraform plan -no-color > plan_output.txt
          fi

      - name: "Publish Plan to Dashboard"
        run: |
          echo "### 📋 Terraform Plan Preview" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`diff" >> $GITHUB_STEP_SUMMARY
          cat plan_output.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          
      - name: "Run Checkov Security Scan"
        uses: bridgecrewio/checkov-action@master
        with:
          framework: terraform
          soft_fail: true 
          severity: "HIGH,CRITICAL"
          output_format: cli,github_failed_only
          output_file_path: "./"

      - name: "Publish Security Scan to Dashboard"
        if: always()
        run: |
          echo "### 🛡️ Checkov Security Report (High & Critical Only)" >> $GITHUB_STEP_SUMMARY
          if [ -f results_github_failed_only.md ]; then
            cat results_github_failed_only.md >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No High or Critical security issues detected!" >> $GITHUB_STEP_SUMMARY
          fi
          
    deploy_or_destroy:
    name: "2. Manual Execution Gate"
    needs: build_and_plan         
    environment: production       
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ fromJSON(secrets.AZURE_CREDENTIALS).clientId }}
      ARM_CLIENT_SECRET: ${{ fromJSON(secrets.AZURE_CREDENTIALS).clientSecret }}
      ARM_SUBSCRIPTION_ID: ${{ fromJSON(secrets.AZURE_CREDENTIALS).subscriptionId }}
      ARM_TENANT_ID: ${{ fromJSON(secrets.AZURE_CREDENTIALS).tenantId }}
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      # Safely reads the real commit text directly from the code repository
      - name: "Extract Git Commit Message"
        id: parse_msg
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Captured Message: $COMMIT_MSG"
          if [[ "$COMMIT_MSG" == *"-destroy"* ]]; then
            echo "ACTION_TYPE=destroy" >> $GITHUB_ENV
          else
            echo "ACTION_TYPE=apply" >> $GITHUB_ENV
          fi

      # 👇 FIXED: Authenticates the Azure CLI session so it can process deletions
      - name: "Login to Azure"
        if: ${{ env.ACTION_TYPE == 'destroy' }}
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.1.0"

      - name: "Terraform Init"
        run: terraform init

      # 👇 FIXED: Correct syntax evaluates this block properly during a destroy run
      - name: "Terraform Destroy"
        if: ${{ env.ACTION_TYPE == 'destroy' }}
        run: |
          echo "Forcefully clearing Azure ExpressRoute Connection Lock..."
          az network vpn-connection delete --name CoreServicesToTestERCircuit --resource-group ContosoResourceGroup || true
          
          echo "Running standard clean-up on remaining infrastructure..."
          terraform destroy -auto-approve

      # 👇 FIXED: Correct syntax evaluates this block properly during an apply run
      - name: "Terraform Apply"
        if: ${{ env.ACTION_TYPE == 'apply' }}
        run: terraform apply -auto-approve
