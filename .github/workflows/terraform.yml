name: "Terraform Manual Release Pipeline"

on:
  push:
    branches:
      - main

jobs:
   # STAGE 1: Automatically run the check/dry-run plan
  build_and_plan:
    name: "1. Automated Plan Check"
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ fromJSON(secrets.AZURE_CREDENTIALS).clientId }}
      ARM_CLIENT_SECRET: ${{ fromJSON(secrets.AZURE_CREDENTIALS).clientSecret }}
      ARM_SUBSCRIPTION_ID: ${{ fromJSON(secrets.AZURE_CREDENTIALS).subscriptionId }}
      ARM_TENANT_ID: ${{ fromJSON(secrets.AZURE_CREDENTIALS).tenantId }}
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.1.0"

      - name: "Terraform Init"
        run: terraform init

      # 👇 1. Captures the plan output text into a file
      - name: "Terraform Plan"
        run: terraform plan -no-color > plan_output.txt

      # 👇 2. Injects that plan text directly onto the GitHub Actions dashboard
      - name: "Publish Plan to Dashboard"
        run: |
          echo "### 📋 Terraform Plan Preview" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`diff" >> $GITHUB_STEP_SUMMARY
          cat plan_output.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          
     # 👇 UPDATED CHECKOV STEP WITH SEVERITY FILTER & DASHBOARD OUTPUT
     - name: "Run Checkov Security Scan"
        uses: bridgecrewio/checkov-action@master
        with:
          framework: terraform
          soft_fail: true 
          # 1. FIXED: Correct argument to filter out Low/Medium issues
          severity: "HIGH,CRITICAL"
          # 2. FIXED: Keeps the multi-format capability healthy
          output_format: cli,github_failed_only
          # 3. FIXED: Ensures files dump directly in the workspace root cleanly
          output_file_path: "./"

      # 👇 NEW STEP: Appends Checkov's Markdown report straight onto the GitHub dashboard
      - name: "Publish Security Scan to Dashboard"
        if: always() # Ensures the report prints even if errors occur
        run: |
          echo "### 🛡️ Checkov Security Report (High & Critical Only)" >> $GITHUB_STEP_SUMMARY
          if [ -f checkov_report.md ]; then
            cat checkov_report.md >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No High or Critical security issues detected!" >> $GITHUB_STEP_SUMMARY
          fi
          
  # STAGE 2: The Manual Gate Deployment
  deploy_to_azure:
    name: "2. Manual Apply Execution"
    needs: build_and_plan         # 👈 Ensures Stage 1 must pass successfully first
    environment: production       # 👈 This keyword fires off your manual review gate!
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ fromJSON(secrets.AZURE_CREDENTIALS).clientId }}
      ARM_CLIENT_SECRET: ${{ fromJSON(secrets.AZURE_CREDENTIALS).clientSecret }}
      ARM_SUBSCRIPTION_ID: ${{ fromJSON(secrets.AZURE_CREDENTIALS).subscriptionId }}
      ARM_TENANT_ID: ${{ fromJSON(secrets.AZURE_CREDENTIALS).tenantId }}
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.1.0"

      - name: "Terraform Init"
        run: terraform init

      - name: "Terraform Apply"
        run: terraform apply -auto-approve # Safe because you manually authorized it to run
